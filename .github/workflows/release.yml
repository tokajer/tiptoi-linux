# Builds the AppImage and attaches it to a GitHub release. Two ways to start it:
#   - Publish a release in the GitHub UI (tag vX.Y.Z): the AppImage is attached to that release.
#   - Actions tab -> "Release" -> "Run workflow": attaches to release v<version> if it already
#     exists, otherwise creates it with generated notes.
# The version comes from pyproject.toml; bump it there (and in tiptoi_linux/__init__.py) first.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the release as a pre-release (only when this run creates it)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      exists: ${{ steps.resolve.outputs.exists }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the release tag and the commit to build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag="v${version}"
          if [ "$EVENT" = "release" ]; then
            if [ "$RELEASE_TAG" != "$tag" ]; then
              echo "::error::release tag $RELEASE_TAG does not match pyproject.toml version $version (expected $tag)"
              exit 1
            fi
            exists=true
            ref="$GITHUB_SHA"
          elif gh release view "$tag" >/dev/null 2>&1; then
            # WHY: an existing release points at its tag - build that commit, not whatever
            # branch this run was started from, so the attached AppImage matches the release
            exists=true
            ref="$tag"
          else
            exists=false
            ref="$GITHUB_SHA"
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "exists=${exists}"
            echo "ref=${ref}"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      # 3.11 is the floor declared in pyproject.toml; testing there catches 3.12+ APIs.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # libQt6Gui needs these at import time even with the offscreen platform (see PLANS.md).
      - name: Install Qt runtime libraries and gettext
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 gettext

      - name: Install PySide6 (same version the AppImage bundles)
        run: |
          version="$(sed -n 's/^readonly PYSIDE6_VERSION="\(.*\)"$/\1/p' packaging/build-appimage.sh)"
          python -m pip install --quiet "PySide6-Essentials==${version}"

      - name: Check the compiled translations match their sources
        run: |
          for po in tiptoi_linux/locale/*/LC_MESSAGES/*.po; do
            [ -e "$po" ] || continue
            mo="${po%.po}.mo"
            msgfmt --check -o "$RUNNER_TEMP/fresh.mo" "$po"
            python - "$mo" "$RUNNER_TEMP/fresh.mo" <<'EOF'
          import gettext, sys
          def load(path):
              with open(path, "rb") as f:
                  return gettext.GNUTranslations(f)._catalog
          if load(sys.argv[1]) != load(sys.argv[2]):
              sys.exit(f"{sys.argv[1]} is stale: recompile it with msgfmt")
          EOF
          done

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          LANGUAGE: C
        run: python -m unittest discover -s tests -t .

  release:
    needs: [resolve, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Check the version at the build commit
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          package_version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' tiptoi_linux/__init__.py)"
          if [ "$version" != "$VERSION" ]; then
            echo "::error::the release tag's pyproject.toml says $version, expected $VERSION"
            exit 1
          fi
          if [ "$version" != "$package_version" ]; then
            echo "::error::pyproject.toml says $version but tiptoi_linux/__init__.py says $package_version"
            exit 1
          fi

      # The build script rasterises the SVG icon with magick, convert or inkscape, and its
      # post-trim check imports PySide6.QtWidgets, which needs the same Qt runtime libraries as
      # the test job even under the offscreen platform.
      - name: Install build tools and Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            inkscape libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # Only checksum-pinned downloads live here; the build script re-verifies every cache hit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packaging/build/cache
          key: appimage-cache-${{ hashFiles('packaging/build-appimage.sh') }}

      - name: Build the AppImage
        run: bash packaging/build-appimage.sh

      - name: Smoke-test on Ubuntu 22.04 and Debian 12
        run: bash packaging/smoke-test.sh

      - name: Publish the AppImage
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
          EXISTS: ${{ needs.resolve.outputs.exists }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          asset="tiptoi-${VERSION}-x86_64.AppImage"
          mv tiptoi-x86_64.AppImage "$asset"
          sha256sum "$asset" > SHA256SUMS
          if [ "$EXISTS" = "true" ]; then
            # WHY: no --clobber - a re-run must not silently replace an AppImage users may
            # already have downloaded and checksummed; delete the asset by hand to rebuild it
            gh release upload "$TAG" "$asset" SHA256SUMS
          else
            flags=()
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "$asset" SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "tiptoi-linux ${VERSION}" \
              --generate-notes \
              "${flags[@]}"
          fi
